<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Utilizador - Sapatilhas Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="logo">Sapatilhas Store</div>
    </header>

    <div class="container">
        <h1>Área de Utilizador</h1>

        <div class="auth-grid">
            <!-- Cartão de Login -->
            <div class="auth-card">
                <h2>Iniciar Sessão</h2>
                <form action="/login" method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="login-password">Palavra-passe</label>
                        <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
            </div>

            <!-- Bloco separador central -->
            <div class="auth-divider">
                <span>ou</span>
            </div>

            <!-- Cartão de Registo -->
            <div class="auth-card">
                <h2>Criar Conta</h2>
                <form action="/registo" method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="reg-nome">Nome Completo</label>
                        <input type="text" id="reg-nome" name="nome" placeholder="O teu nome" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" placeholder="exemplo@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Palavra-passe</label>
                        <input type="password" id="reg-password" name="password" placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-confirm-password">Confirmar Palavra-passe</label>
                        <input type="password" id="reg-confirm-password" name="confirm_password" placeholder="Repete a palavra-passe" required>
                    </div>

                    <button type="submit" class="btn-success">Registar</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
