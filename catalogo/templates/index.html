<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Sapatilhas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <div class="logo">Sapatilhas Store</div>
        
        <!-- Nova div agrupa a pesquisa e as ações -->
        <div class="header-controls">
            <div class="search-bar">
                <input type="text" placeholder="Pesquisar por marca, modelo...">
                <button type="button">Pesquisar</button>
            </div>

            <div class="nav-actions">
                <button type="button">🛒 Carrinho (0)</button>
                <button type="button">Login / Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <h1>Catálogo de Sapatilhas</h1>        
            
        <ul>      
            {% for produto in catalogo %}
                <li>{{ produto["marca"] }}</li>
                <li>{{ produto["modelo"]}}</li>
            {% endfor %}      
        </ul> 
        </div>
    </div>

</body>
</html>
